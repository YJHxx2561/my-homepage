    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Noto+Serif+SC:wght@200&display=swap');
        :root {
            --bg: #050505;
            --text: #ffffff;
            --dim: #222;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
            -webkit-user-select: text;
            user-select: text;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }
        .ambient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #121212 0%, transparent 60%);
            z-index: 0;
        }
        /* ===== 3D 酷炫跟随光标（渐进增强，不支持时回退原生鼠标） ===== */
        .cursor-fx{
            position:fixed;
            top:0; left:0;
            width:0; height:0;
            z-index:9999;
            pointer-events:none;
        }
        body.custom-cursor,
        body.custom-cursor *{ cursor:none !important; }
        /* 发光核心点 */
        .cursor-dot{
            position:absolute;
            top:0; left:0;
            width:7px; height:7px;
            margin:-3.5px 0 0 -3.5px;
            border-radius:50%;
            background:#fff;
            box-shadow:0 0 14px 4px rgba(255,255,255,.75), 0 0 30px 10px rgba(255,255,255,.25);
            will-change:transform;
        }
        /* 旋转虚线光环 */
        .cursor-halo{
            position:absolute;
            top:0; left:0;
            width:46px; height:46px;
            margin:-23px 0 0 -23px;
            border:1px dashed rgba(255,255,255,.6);
            border-radius:50%;
            box-shadow:0 0 18px rgba(255,255,255,.12), inset 0 0 14px rgba(255,255,255,.06);
            transform-style:preserve-3d;
            -webkit-transform-style:preserve-3d;
            will-change:transform;
            transition:border-color .35s, box-shadow .35s;
        }
        .cursor-halo::before{
            content:'';
            position:absolute;
            inset:-6px;
            border:1px solid rgba(255,255,255,.14);
            border-radius:50%;
        }
        .cursor-halo::after{
            content:'';
            position:absolute;
            top:-3px; left:50%;
            width:3px; height:3px;
            margin-left:-1.5px;
            border-radius:50%;
            background:#fff;
            box-shadow:0 0 8px 2px rgba(255,255,255,.7);
        }
        /* 拖尾粒子 */
        .cursor-trail{
            position:absolute;
            top:0; left:0;
            width:10px; height:10px;
            margin:-5px 0 0 -5px;
            border-radius:50%;
            background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
            will-change:transform, opacity;
        }
        /* 点击波纹 */
        .cursor-ripple{
            position:absolute;
            top:0; left:0;
            width:20px; height:20px;
            margin:-10px 0 0 -10px;
            border:1px solid #fff;
            border-radius:50%;
            opacity:0;
            will-change:transform, opacity;
        }
        body.custom-cursor.hovering .cursor-halo{
            border-color:rgba(255,255,255,.95);
            box-shadow:0 0 30px rgba(255,255,255,.35), inset 0 0 18px rgba(255,255,255,.15);
        }
        @media (hover:none),(pointer:coarse){
            .cursor-fx{ display:none !important; }
        }
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
        }
        h1 {
            font-size: clamp(5rem, 25vw, 15rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            line-height: 1;
            background: linear-gradient(180deg, #fff 40%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 2.5s cubic-bezier(0.2, 0, 0.2, 1);
            -webkit-user-select: none;
            user-select: none;
        }
        .poem {
            writing-mode: vertical-rl;
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            letter-spacing: 0.8em;
            color: #555;
            margin-left: 40px;
            font-weight: 200;
            transition: 1s;
            -webkit-user-select: none;
            user-select: none;
        }
        .poem:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        .footer {
            position: absolute;
            bottom: 62px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--dim);
            font-family: sans-serif;
            z-index: 2;
            -webkit-user-select: none;
            user-select: none;
        }
        .footer .footer-link {
            color: inherit;
            text-decoration: none;
            transition: 0.4s;
            outline: none;
        }
        .footer .footer-link:focus {
            outline: none;
        }
        .footer .footer-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.25);
        }
        .copyright {
            position: absolute;
            bottom: 18px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            line-height: 1.7;
            letter-spacing: 2px;
            color: #333;
            font-family: sans-serif;
            z-index: 2;
            -webkit-user-select: none;
            user-select: none;
        }
        .copyright a {
            color: #555;
            text-decoration: none;
            transition: 0.4s;
            outline: none;
        }
        .copyright a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.25);
        }
        /* 弹窗面板 */
        .info-panel{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: rgba(7,7,7,0.94);
            border:1px solid #202020;
            padding:38px 44px 32px;
            z-index:10;
            opacity:0;
            pointer-events:none;
            transition: opacity 0.6s ease;
            min-width:430px;
            max-width:92vw;
            max-height:86vh;
            overflow-y:auto;
            backdrop-filter: blur(6px);
            scrollbar-width:thin;
            scrollbar-color:#333 transparent;
        }
        .info-panel::-webkit-scrollbar{ width:5px; }
        .info-panel::-webkit-scrollbar-track{ background:transparent; }
        .info-panel::-webkit-scrollbar-thumb{ background:#333; border-radius:3px; }
        .info-panel.show{
            opacity:1;
            pointer-events:auto;
        }
        .info-panel h2{
            font-family:'Cinzel',serif;
            font-size:1.8rem;
            margin-bottom:22px;
            letter-spacing:0.12em;
            text-align:center;
            background: linear-gradient(180deg, #fff 40%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        /* 分区 */
        .panel-section{ margin-bottom:20px; }
        .panel-section:last-child{ margin-bottom:0; }
        .section-title{
            font-family:sans-serif;
            font-size:11px;
            font-weight:200;
            letter-spacing:3px;
            color:#666;
            text-align:center;
            margin-bottom:13px;
            padding-bottom:9px;
            border-bottom:1px solid #1c1c1c;
            -webkit-user-select:none;
            user-select:none;
        }
        /* 两栏布局核心 */
        .info-item{
            font-family:sans-serif;
            color:#aaa;
            margin-bottom:12px;
            font-size:13px;
            letter-spacing:1px;
            display: flex;
            gap: 20px;
        }
        .panel-section .info-item:last-child{ margin-bottom:0; }
        /* 左侧名称栏 */
        .info-label {
            flex: 1;
            text-align: center;
        }
        /* 右侧内容栏 */
        .info-value {
            flex: 1;
            text-align: center;
        }
        .info-value.full{ flex:1 1 100%; }
        .info-value a{
            color:#ccc;
            text-decoration:none;
            transition:.3s;
            outline:none;
            -webkit-user-select: text;
            user-select: text;
        }
        .info-value a:hover{
            color:#fff;
            text-shadow:0 0 8px rgba(255,255,255,0.22);
        }
        /* 联系方式图标 */
        .contact-icons{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:38px;
            padding:6px 0 2px;
        }
        .contact-icon{
            color:#8a8a8a;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            transition:.4s;
            outline:none;
        }
        .contact-icon svg{
            width:26px;
            height:26px;
            fill:currentColor;
            display:block;
        }
        .contact-icon:hover,
        .contact-icon:focus{
            color:#fff;
            filter:drop-shadow(0 0 8px rgba(255,255,255,0.45));
            transform:translateY(-2px);
        }
        /* 数值：运行时间 / 访问统计 */
        .stat-num{
            color:#e0e0e0;
            font-variant-numeric:tabular-nums;
            text-shadow:0 0 10px rgba(255,255,255,0.18);
        }
        .copyright-line{ line-height:1.9; color:#888; }
        .close-btn{
            position:absolute;
            top:18px;
            right:22px;
            color:#444;
            cursor:pointer;
            transition:.4s;
            font-size:22px;
            outline:none;
            -webkit-user-select: none;
            user-select: none;
        }
        .close-btn:hover{
            color:#fff;
        }
        .mask{
            position:fixed;
            inset:0;
            z-index:9;
            background:rgba(0,0,0,0.45);
            opacity:0;
            pointer-events:none;
            transition: opacity 0.6s ease;
        }
        .mask.show{
            opacity:1;
            pointer-events:auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; letter-spacing: 0.3em; filter: blur(15px); }
            to { opacity: 1; letter-spacing: 0.1em; filter: blur(0); }
        }
        @media (max-width: 768px) {
            .content { flex-direction: column; }
            .poem { writing-mode: horizontal-tb; margin-left: 0; margin-top: 20px; letter-spacing: 0.4em; }
            h1 { font-size: 6rem; }
            .footer { bottom: 72px; gap: 22px; font-size: 10px; letter-spacing: 2px; }
            .copyright {
                bottom: 14px;
                font-size: 9px;
                letter-spacing: 1px;
                line-height: 1.9;
                padding: 0 10px;
            }
            .info-panel{
                width:92%;
                padding:30px 20px 26px;
                min-width: unset;
                max-height:88vh;
            }
            .info-panel h2{ font-size:1.5rem; }
            .info-item { gap: 10px; font-size: 12px; }
            .section-title { letter-spacing: 2px; }
            .contact-icons { gap: 30px; }
            .contact-icon svg { width: 24px; height: 24px; }
        }
    </style>
</head>

    <script>
        const ambient = document.getElementById('ambient');
        const contactBtn = document.getElementById('contactBtn');
        const infoPanel = document.getElementById('infoPanel');
        const mask = document.getElementById('mask');
        const closeBtn = document.getElementById('closeBtn');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            ambient.style.setProperty('--x', x + '%');
            ambient.style.setProperty('--y', y + '%');
        });
        function openPanel(){
            infoPanel.classList.add('show');
            mask.classList.add('show');
        }
        function closePanel(){
            infoPanel.classList.remove('show');
            mask.classList.remove('show');
        }
        contactBtn.addEventListener('click',openPanel);
        closeBtn.addEventListener('click',closePanel);
        mask.addEventListener('click',closePanel);

        // 本站运行时间：自 2026 年 8 月 14 日起实时计时
        const uptimeEl = document.getElementById('uptime');
        const startTime = new Date(2026, 7, 14, 0, 0, 0); // 月份从 0 开始，7 = 8 月
        function updateUptime(){
            const diff = Math.max(0, Date.now() - startTime.getTime());
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            if (uptimeEl) {
                uptimeEl.textContent = days + ' 天 ' + hours + ' 小时 ' + minutes + ' 分 ' + seconds + ' 秒';
            }
        }
        updateUptime();
        setInterval(updateUptime, 1000);

        // ===== 3D 酷炫跟随光标（渐进增强）=====
        // 支持 CSS 3D transform 且非粗指针（触屏）设备时启用；
        // 其余浏览器保留原生鼠标光标，功能完全不受影响。
        (function(){
            const supports3D = !!(window.CSS && CSS.supports &&
                CSS.supports('transform', 'perspective(500px) rotateX(10deg)'));
            const isTouch = window.matchMedia &&
                window.matchMedia('(pointer: coarse)').matches;
            if (!supports3D || isTouch) return;

            const fx     = document.getElementById('cursorFx');
            const halo   = document.getElementById('cursorHalo');
            const dot    = document.getElementById('cursorDot');
            const ripple = document.getElementById('cursorRipple');
            if (!fx || !halo || !dot) return;
            const trails = [1,2,3,4,5].map(i => document.getElementById('trail' + i)).filter(Boolean);

            document.body.classList.add('custom-cursor');

            let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
            let hx = mouseX, hy = mouseY;          // 光环（阻尼跟随）
            let lastX = mouseX, lastY = mouseY;
            let vx = 0, vy = 0;                    // 平滑后的移动速度
            let spin = 0;                          // 光环自转角度
            const reduce = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // 拖尾粒子的历史位置
            const pts = trails.map(() => ({ x: mouseX, y: mouseY }));

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                fx.style.opacity = '1';
            }, { passive: true });
            document.addEventListener('mouseleave', () => { fx.style.opacity = '0'; });
            document.addEventListener('mouseenter', () => { fx.style.opacity = '1'; });

            // 点击波纹：从点击点扩散
            let rippleAnim = null;
            document.addEventListener('mousedown', (e) => {
                if (reduce || !ripple) return;
                if (rippleAnim) cancelAnimationFrame(rippleAnim);
                const rx = e.clientX, ry = e.clientY;
                let t = 0;
                ripple.style.opacity = '0.9';
                (function step(){
                    t += 0.06;
                    const s = 1 + t * 4;
                    ripple.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0) scale(' + s + ')';
                    ripple.style.opacity = String(Math.max(0, 0.9 - t * 0.9));
                    if (t < 1) rippleAnim = requestAnimationFrame(step);
                })();
            });

            // 悬停在可点击元素上时，光环高亮放大
            const interactive = 'a, button, .close-btn, .footer-link';
            document.addEventListener('mouseover', (e) => {
                if (e.target instanceof Element && e.target.closest(interactive)) {
                    document.body.classList.add('hovering');
                }
            });
            document.addEventListener('mouseout', (e) => {
                if (e.target instanceof Element && e.target.closest(interactive)) {
                    document.body.classList.remove('hovering');
                }
            });

            function render(){
                const rawVx = mouseX - lastX;
                const rawVy = mouseY - lastY;
                lastX = mouseX; lastY = mouseY;
                vx += (rawVx - vx) * 0.15;
                vy += (rawVy - vy) * 0.15;

                // 光环阻尼跟随；核心点直接跟随鼠标坐标
                hx += (mouseX - hx) * 0.16;
                hy += (mouseY - hy) * 0.16;

                const speed = Math.min(Math.sqrt(vx * vx + vy * vy), 50);
                const tiltX = reduce ? 0 : Math.max(-35, Math.min(35, -vy * 1.5));
                const tiltY = reduce ? 0 : Math.max(-35, Math.min(35,  vx * 1.5));
                spin += reduce ? 0 : 0.6 + speed * 0.15;
                const scale = 1 + speed / 120 + (document.body.classList.contains('hovering') ? 0.3 : 0);

                dot.style.transform = 'translate3d(' + mouseX + 'px,' + mouseY + 'px,0)';
                halo.style.transform =
                    'translate3d(' + hx + 'px,' + hy + 'px,0) ' +
                    'perspective(520px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) ' +
                    'rotate(' + spin + 'deg) scale(' + scale + ')';

                // 拖尾：每个粒子平滑追逐前一个，尺寸与透明度递减
                let tx = mouseX, ty = mouseY;
                pts.forEach((p, i) => {
                    p.x += (tx - p.x) * 0.32;
                    p.y += (ty - p.y) * 0.32;
                    const k = 1 - i / (pts.length + 1);
                    trails[i].style.transform =
                        'translate3d(' + p.x + 'px,' + p.y + 'px,0) scale(' + k.toFixed(2) + ')';
                    trails[i].style.opacity = (k * 0.7).toFixed(2);
                    tx = p.x; ty = p.y;
                });
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        })();
    </script>
    <!-- 访问统计：与 SunPanel 使用同一后端 -->
