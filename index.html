<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YJH Homepage</title>
    <!-- 浏览器标签页图标 -->
    <link rel="icon" type="image/png" href="https://raw.web.yjhup.com/images/avatar/avatar-1.png">
    <!-- SEO: 描述、关键词与作者 -->
    <meta name="description" content="YJH 的个人主页 —— 探索博客、开源项目与更多内容。Blog, projects and more from YJH.">
    <meta name="keywords" content="YJH, YJH Homepage, YJH 个人主页, yjhup.com, YJH blog, YJH 博客, YJH projects, 个人博客, 开源项目, developer, web developer, 开发者, 程序员, portfolio">
    <meta name="author" content="YJH">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://yjhup.com/">
    <!-- Open Graph / 社交分享 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="YJH Homepage">
    <meta property="og:description" content="YJH 的个人主页 —— 探索博客、开源项目与更多内容。">
    <meta property="og:url" content="https://yjhup.com/">
    <meta property="og:site_name" content="YJH Homepage">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="YJH Homepage">
    <meta name="twitter:description" content="YJH 的个人主页 —— 探索博客、开源项目与更多内容。">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Noto+Serif+SC:wght@200&display=swap');
        :root {
            --bg: #050505;
            --text: #ffffff;
            --dim: #222;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
            -webkit-user-select: text;
            user-select: text;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }
        .ambient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #121212 0%, transparent 60%);
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
        }
        h1 {
            font-size: clamp(5rem, 25vw, 15rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            line-height: 1;
            background: linear-gradient(180deg, #fff 40%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 2.5s cubic-bezier(0.2, 0, 0.2, 1);
            -webkit-user-select: none;
            user-select: none;
        }
        .poem {
            writing-mode: vertical-rl;
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            letter-spacing: 0.8em;
            color: #555;
            margin-left: 40px;
            font-weight: 200;
            transition: 1s;
            -webkit-user-select: none;
            user-select: none;
        }
        .poem:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        .footer {
            position: absolute;
            bottom: 62px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--dim);
            font-family: sans-serif;
            z-index: 2;
            -webkit-user-select: none;
            user-select: none;
        }
        .footer .footer-link {
            color: inherit;
            text-decoration: none;
            transition: 0.4s;
            outline: none;
        }
        .footer .footer-link:focus {
            outline: none;
        }
        .footer .footer-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.25);
        }
        .copyright {
            position: absolute;
            bottom: 18px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            line-height: 1.7;
            letter-spacing: 2px;
            color: #333;
            font-family: sans-serif;
            z-index: 2;
            -webkit-user-select: none;
            user-select: none;
        }
        .copyright a {
            color: #555;
            text-decoration: none;
            transition: 0.4s;
            outline: none;
        }
        .copyright a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.25);
        }
        /* 弹窗面板 */
        .info-panel{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: rgba(7,7,7,0.94);
            border:1px solid #202020;
            padding:38px 44px 32px;
            z-index:10;
            opacity:0;
            pointer-events:none;
            transition: opacity 0.6s ease;
            min-width:430px;
            max-width:92vw;
            max-height:86vh;
            overflow-y:auto;
            backdrop-filter: blur(6px);
            scrollbar-width:thin;
            scrollbar-color:#333 transparent;
        }
        .info-panel::-webkit-scrollbar{ width:5px; }
        .info-panel::-webkit-scrollbar-track{ background:transparent; }
        .info-panel::-webkit-scrollbar-thumb{ background:#333; border-radius:3px; }
        .info-panel.show{
            opacity:1;
            pointer-events:auto;
        }
        .info-panel h2{
            font-family:'Cinzel',serif;
            font-size:1.8rem;
            margin-bottom:22px;
            letter-spacing:0.12em;
            text-align:center;
            background: linear-gradient(180deg, #fff 40%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        /* 分区 */
        .panel-section{ margin-bottom:20px; }
        .panel-section:last-child{ margin-bottom:0; }
        .section-title{
            font-family:sans-serif;
            font-size:11px;
            font-weight:200;
            letter-spacing:3px;
            color:#666;
            text-align:center;
            margin-bottom:13px;
            padding-bottom:9px;
            border-bottom:1px solid #1c1c1c;
            -webkit-user-select:none;
            user-select:none;
        }
        /* 两栏布局核心 */
        .info-item{
            font-family:sans-serif;
            color:#aaa;
            margin-bottom:12px;
            font-size:13px;
            letter-spacing:1px;
            display: flex;
            gap: 20px;
        }
        .panel-section .info-item:last-child{ margin-bottom:0; }
        /* 左侧名称栏 */
        .info-label {
            flex: 1;
            text-align: center;
        }
        /* 右侧内容栏 */
        .info-value {
            flex: 1;
            text-align: center;
        }
        .info-value.full{ flex:1 1 100%; }
        .info-value a{
            color:#ccc;
            text-decoration:none;
            transition:.3s;
            outline:none;
            -webkit-user-select: text;
            user-select: text;
        }
        .info-value a:hover{
            color:#fff;
            text-shadow:0 0 8px rgba(255,255,255,0.22);
        }
        /* 联系方式图标 */
        .contact-icons{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:38px;
            padding:6px 0 2px;
        }
        .contact-icon{
            color:#8a8a8a;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            transition:.4s;
            outline:none;
        }
        .contact-icon svg{
            width:26px;
            height:26px;
            fill:currentColor;
            display:block;
        }
        .contact-icon:hover,
        .contact-icon:focus{
            color:#fff;
            filter:drop-shadow(0 0 8px rgba(255,255,255,0.45));
            transform:translateY(-2px);
        }
        /* 数值：运行时间 / 访问统计 */
        .stat-num{
            color:#e0e0e0;
            font-variant-numeric:tabular-nums;
            text-shadow:0 0 10px rgba(255,255,255,0.18);
        }
        .copyright-line{ line-height:1.9; color:#888; }
        .close-btn{
            position:absolute;
            top:18px;
            right:22px;
            color:#444;
            cursor:pointer;
            transition:.4s;
            font-size:22px;
            outline:none;
            -webkit-user-select: none;
            user-select: none;
        }
        .close-btn:hover{
            color:#fff;
        }
        .mask{
            position:fixed;
            inset:0;
            z-index:9;
            background:rgba(0,0,0,0.45);
            opacity:0;
            pointer-events:none;
            transition: opacity 0.6s ease;
        }
        .mask.show{
            opacity:1;
            pointer-events:auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; letter-spacing: 0.3em; filter: blur(15px); }
            to { opacity: 1; letter-spacing: 0.1em; filter: blur(0); }
        }
        @media (max-width: 768px) {
            .content { flex-direction: column; }
            .poem { writing-mode: horizontal-tb; margin-left: 0; margin-top: 20px; letter-spacing: 0.4em; }
            h1 { font-size: 6rem; }
            .footer { bottom: 72px; gap: 22px; font-size: 10px; letter-spacing: 2px; }
            .copyright {
                bottom: 14px;
                font-size: 9px;
                letter-spacing: 1px;
                line-height: 1.9;
                padding: 0 10px;
            }
            .info-panel{
                width:92%;
                padding:30px 20px 26px;
                min-width: unset;
                max-height:88vh;
            }
            .info-panel h2{ font-size:1.5rem; }
            .info-item { gap: 10px; font-size: 12px; }
            .section-title { letter-spacing: 2px; }
            .contact-icons { gap: 30px; }
            .contact-icon svg { width: 24px; height: 24px; }
        }
    </style>
</head>
<body>
    <div class="ambient" id="ambient"></div>
    <div class="content">
        <h1>YJH</h1>
        <div class="poem">纵浮槎来，浮槎去，不相逢。</div>
    </div>
    <div class="footer">
        <a class="footer-link" href="https://blog.yjhup.com" target="_blank" rel="noopener noreferrer">BLOG</a>
        <a class="footer-link" href="https://website.web.yjhup.com" target="_blank" rel="noopener noreferrer">PROJECTS</a>
        <span class="footer-link" id="contactBtn">MORE</span>
    </div>
    <div class="copyright">
        <div><a href="https://icp.gov.moe/?keyword=20266613" target="_blank" rel="noopener noreferrer">萌ICP备20266613号</a></div>
        <div>Copyright © 2026 <a href="https://yjhup.com" target="_blank" rel="noopener noreferrer">YJH</a>. All rights reserved. | Powered by <a href="https://yjhup.com" target="_blank" rel="noopener noreferrer">YJH</a></div>
    </div>
    <div class="mask" id="mask"></div>
    <div class="info-panel" id="infoPanel">
        <div class="close-btn" id="closeBtn">×</div>
        <h2>MORE</h2>

        <!-- 联系信息 -->
        <section class="panel-section">
            <div class="section-title">联系信息</div>
            <div class="contact-icons">
                <a class="contact-icon" href="https://github.com/YJHxx2561" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .96-.31 3.17 1.18.92-.26 1.9-.39 2.88-.39.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.27 5.68.41.36.78 1.06.78 2.14 0 1.54-.01 2.78-.01 3.16 0 .31.21.67.8.56C20.21 21.39 23.5 17.08 23.5 12c0-6.27-5.23-11.5-11.5-11.5z"/></svg>
                </a>
                <a class="contact-icon" href="mailto:me@yjhup.com" title="Email" aria-label="Email">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 4h20c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H2c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm10 9.2L3.6 6.3c-.4-.3-1 0-1 .5V7c0 .3.1.5.3.7l9.1 6.9c.6.5 1.4.5 2 0l9.1-6.9c.2-.2.3-.4.3-.7v-.2c0-.5-.6-.8-1-.5L12 13.2z"/></svg>

                <a class="contact-icon" href="https://t.me/xyjhupcom" target="_blank" rel="noopener noreferrer" title="Telegram" aria-label="Telegram">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.18-1.87 8.83c-.14.63-.51.78-1.03.49l-2.85-2.1-1.37 1.32c-.15.15-.28.28-.57.28l.2-2.87 5.22-4.72c.23-.2-.05-.31-.35-.11L7.6 13.36l-2.79-.87c-.61-.19-.62-.61.13-.9l10.9-4.2c.51-.19.95.12.72.79z"/></svg>
                </a>
            </div>
        </section>

        <!-- 本站运行时间 -->
        <section class="panel-section">
            <div class="section-title">本站运行时间</div>
            <div class="info-item">
                <div class="info-value full"><span class="stat-num" id="uptime">—</span></div>
            </div>
        </section>

        <!-- 访问统计 -->
        <section class="panel-section">
            <div class="section-title">访问统计</div>
            <div class="info-item">
                <div class="info-label">本页访问人次</div>
                <div class="info-value"><span class="stat-num" id="page_pv">—</span></div>
            </div>
            <div class="info-item">
                <div class="info-label">本页访问人数</div>
                <div class="info-value"><span class="stat-num" id="page_uv">—</span></div>
            </div>
        </section>

        <!-- 备案信息 -->
        <section class="panel-section">
            <div class="section-title">备案信息</div>
            <div class="info-item">
                <div class="info-value full"><a href="https://icp.gov.moe/?keyword=20266613" target="_blank" rel="noopener noreferrer">萌ICP备20266613号</a></div>
            </div>
        </section>

        <!-- 版权信息 -->
        <section class="panel-section">
            <div class="section-title">版权信息</div>
            <div class="info-item">
                <div class="info-value full copyright-line">
                    Copyright © 2026 <a href="https://yjhup.com" target="_blank" rel="noopener noreferrer">YJH</a>. All rights reserved. | Powered by <a href="https://yjhup.com" target="_blank" rel="noopener noreferrer">YJH</a>
                </div>
            </div>
        </section>
    </div>
    <script>
        const ambient = document.getElementById('ambient');
        const contactBtn = document.getElementById('contactBtn');
        const infoPanel = document.getElementById('infoPanel');
        const mask = document.getElementById('mask');
        const closeBtn = document.getElementById('closeBtn');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            ambient.style.setProperty('--x', x + '%');
            ambient.style.setProperty('--y', y + '%');
        });
        function openPanel(){
            infoPanel.classList.add('show');
            mask.classList.add('show');
        }
        function closePanel(){
            infoPanel.classList.remove('show');
            mask.classList.remove('show');
        }
        contactBtn.addEventListener('click',openPanel);
        closeBtn.addEventListener('click',closePanel);
        mask.addEventListener('click',closePanel);

        // 本站运行时间：自 2026 年 8 月 14 日起实时计时
        const uptimeEl = document.getElementById('uptime');
        const startTime = new Date(2026, 7, 14, 0, 0, 0); // 月份从 0 开始，7 = 8 月
        function updateUptime(){
            const diff = Math.max(0, Date.now() - startTime.getTime());
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            if (uptimeEl) {
                uptimeEl.textContent = days + ' 天 ' + hours + ' 小时 ' + minutes + ' 分 ' + seconds + ' 秒';
            }
        }
        updateUptime();
        setInterval(updateUptime, 1000);
    </script>
    <!-- 访问统计：与 SunPanel 使用同一后端 -->
    <script defer src="https://stats.web.yjhup.com/js/index.min.js"></script>
</body>
</html>
